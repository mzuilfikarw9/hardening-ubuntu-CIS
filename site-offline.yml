---
# site-offline.yml — Offline-safe CIS L1 hardening subset.
#
# Use this when apt/package install is unavailable (broken outbound
# network, no internal mirror, etc.). It applies only the file-system,
# config-file, and sysctl portions of the CIS L1 benchmark — no package
# installs, no apt upgrade.
#
# Expected SCAP uplift: ~35-50 additional passing controls depending on
# what was already compliant at baseline.
#
# What it covers:
#   - CIS 1.1.1.x   Kernel module blocklist (cramfs, usb-storage, etc.)
#   - CIS 1.1.2-6   /tmp, /var, /var/log, /dev/shm mount options
#   - CIS 1.5.1-3   ASLR / core dumps / ptrace scope (sysctl)
#   - CIS 1.7.1-6   Warning banners (/etc/issue, /etc/motd, /etc/issue.net)
#   - CIS 3.3.x     Network parameter sysctls (redirects, rp_filter, etc.)
#   - CIS 5.1.x     SSH server config (drop-in at /etc/ssh/sshd_config.d/)
#   - CIS 5.2.x     Sudo defaults (use_pty, logfile, timestamp_timeout)
#   - CIS 5.4-5.5   Password aging, TMOUT, umask in login.defs / profile
#   - CIS 7.1.x     Permissions on /etc/passwd, /etc/shadow, /etc/group
#
# What it does NOT cover (requires apt install, skipped intentionally):
#   - CIS 1.2.x     Package updates (apt upgrade)
#   - CIS 1.3.x     AIDE install
#   - CIS 2.2.x     chrony install and configuration
#   - CIS 3.5.x     Firewall install and config (if ufw isn't present)
#   - CIS 5.3.x     PAM pwquality and faillock (libpam-pwquality install)
#   - CIS 6.x       Full auditd install and rules
#
# Run:
#   ansible-playbook -i inventories/canary.ini site-offline.yml --diff
#
# Then re-scan with SCAP/OpenSCAP to measure the uplift.

- name: CIS L1 Server hardening — offline-safe subset
  hosts: all
  become: true
  gather_facts: true
  serial: "25%"
  vars:
    cis_offline_mode: true

  pre_tasks:
    - name: Assert supported OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version in ["22.04", "24.04"]
        fail_msg: "This playbook only supports Ubuntu 22.04 or 24.04."

    - name: Announce offline mode
      ansible.builtin.debug:
        msg: >-
          Running in offline mode. No package installs or apt upgrades will
          be performed. Only file-system, config, and sysctl changes will be
          applied.

  tasks:
    - name: 1.1.1 Kernel module blocklist
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: kernel_modules.yml

    - name: 1.1.2 Mount options on /tmp, /dev/shm, /var, /home
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: mount_options.yml

    - name: 1.5 Process hardening (ASLR, coredumps, sysctl)
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: process_hardening.yml

    - name: 1.7 Warning banners
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: banners.yml

    - name: 3.3 Network sysctl parameters
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: network.yml

    - name: 5.1 SSH server hardening
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: ssh.yml

    - name: 5.2 Sudo defaults
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: sudo.yml

    - name: 5.4 / 5.5 User environment (login.defs, TMOUT, umask)
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: users.yml

    - name: 7.1 File permissions on /etc/passwd, /etc/shadow, /etc/group
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: file_perms.yml

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Offline hardening applied. Reboot recommended to pick up any sysctl
          or mount changes that require it. Then re-run your SCAP scan to
          measure the uplift.
