---
# tasks/check-k3s-cluster.yml — All k3s nodes Ready + API healthy.
# Run after any master reboot to confirm etcd quorum + scheduler are back.

- name: All nodes Ready?
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get nodes --no-headers | awk '{print $2}' | sort -u
  args:
    executable: /bin/bash
  delegate_to: "{{ dr_k3s_probe_host }}"
  register: _node_states
  until: _node_states.stdout.strip() == 'Ready'
  retries: 20
  delay: 15
  changed_when: false
  become: true

- name: API /readyz
  ansible.builtin.command: kubectl get --raw=/readyz
  delegate_to: "{{ dr_k3s_probe_host }}"
  register: _readyz
  failed_when: _readyz.rc != 0 or 'ok' not in _readyz.stdout
  changed_when: false
  become: true
