# -------- Non-prod on the DC subnet (stg / dev / lisabackend) -----------------
# These appear in the DC column of the verified service-role table, so they
# are in scope for hardening per the vendor scan. Whether they are rebooted
# inside the same Apr 30 prod window or in a separate change is TBD with the
# team — kept in separate groups so they don't block the prod cutover.

[staging]
stg-haprox-01    ansible_host=172.16.102.54
stg-haprox-02    ansible_host=172.16.102.55
stg-lisabackend  ansible_host=172.16.102.66

[dev]
dev-haproxy-01   ansible_host=172.16.102.64

[lisabackend_prod]
prod-lisabackend ansible_host=172.16.102.67

# -------- Ubuntu-version groupings --------------------------------------------
# Handy when a task needs an OS-specific branch (e.g., package names, unit
# file paths differing between 22.04 and 24.04).

[u22:children]
minio

[u24:children]
monitoring
haproxy
k3s_masters
k3s_workers
mysql
proxysql
mongo_rabbit
staging
dev
lisabackend_prod

# -------- Rollout phases ------------------------------------------------------
# Inner → outer sequencing. Run one phase, validate, then move on.

[phase1_observer:children]
monitoring

[phase2_k3s_data:children]
k3s_workers

[phase3_k3s_control:children]
k3s_masters

[phase4_messaging:children]
mongo_rabbit

[phase5_db_proxy:children]
proxysql

[phase6_db:children]
mysql

[phase7_storage:children]
minio

[phase8_edge:children]
haproxy

# Non-prod — run outside the prod maintenance window unless otherwise agreed.
[phase9_nonprod:children]
staging
dev
lisabackend_prod

# -------- Environment supersets -----------------------------------------------

# Everything in scope for the Apr 30 prod cutover (prod service roles only).
[prod:children]
monitoring
haproxy
k3s_masters
k3s_workers
mysql
proxysql
mongo_rabbit
minio
lisabackend_prod

# Full DC scope including stg/dev (matches the vendor-scan "all DC" scope).
[dc:children]
prod
staging
dev

# -------- Shared connection settings ------------------------------------------

[dc:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/Documents/clicque/leet-clicque-key.pem
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
# The playbook runs `become: true`. If the ubuntu user needs a sudo password,
# pass --ask-become-pass on the command line.

