---
# handlers/main.yml

- name: reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: restart auditd
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true

- name: restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: reload apparmor
  ansible.builtin.service:
    name: apparmor
    state: reloaded
