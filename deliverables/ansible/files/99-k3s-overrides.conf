# k3s networking overrides — must win over CIS 60-cis.conf
#
# Why this file exists
# --------------------
# /etc/sysctl.d/60-cis.conf (written by the cis_hardening role) sets
# ip_forward=0 and IPv6 forwarding=0 to satisfy CIS 3.3.1, but these
# values break Kubernetes pod-to-pod networking and NodePort routing.
# The k3s tier (k3s_masters + k3s_workers) needs them set to 1.
#
# This file at lex order 99 wins over 60-cis.conf in /etc/sysctl.d/
# resolution (systemd-sysctl reads files alphabetically; later wins).
#
# bridge-nf-call-{ip,ip6}tables = 1 is required for kube-proxy's
# iptables-mode to see pod-to-service traffic that crosses Linux bridges.
# Without these, kube-proxy load-balancing fails silently.
#
# Origin: dropped on dr-k3s nodes after the 2026-04-20 NodePort outage.
# Replicated to prod k3s nodes before the 2026-04-30 reboot window to
# prevent repeating that outage there. See apply-k3s-overrides.yml.
#
# Long-term: fold these settings into the cis_hardening role and resolve
# task #24 (group_vars cis_sysctl_overrides not landing in 60-cis.conf).
# Until then, this file is the authoritative source on the k3s tier.

net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
