- name: Phase 1 - Safe CIS Hardening (Final Clean Version)
  hosts: all_linux
  serial: 5
  become: yes
  gather_facts: yes

  vars:
    sysctl_rules:
      - { key: 'net.ipv4.ip_forward', value: '0' }
      - { key: 'net.ipv4.conf.all.send_redirects', value: '0' }
      - { key: 'net.ipv4.conf.default.send_redirects', value: '0' }
      - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
      - { key: 'net.ipv4.conf.default.accept_redirects', value: '0' }
      - { key: 'net.ipv4.conf.all.secure_redirects', value: '0' }
      - { key: 'net.ipv4.conf.default.secure_redirects', value: '0' }
      - { key: 'net.ipv4.tcp_syncookies', value: '1' }
      - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
      - { key: 'net.ipv4.conf.default.rp_filter', value: '1' }
      - { key: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
      - { key: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }

    pwquality_rules:
      - { key: 'minlen', value: '14' }
      - { key: 'dcredit', value: '-1' }
      - { key: 'ucredit', value: '-1' }
      - { key: 'lcredit', value: '-1' }
      - { key: 'ocredit', value: '-1' }
      - { key: 'difok', value: '4' }
      - { key: 'dictcheck', value: '1' }
      - { key: 'maxrepeat', value: '3' }

  tasks:

  # =========================
  # PACKAGE INSTALLATION
  # =========================
  - name: Install required packages
    apt:
      name:
        - auditd
        - aide
        - chrony
        - libpam-pwquality
      state: present
      update_cache: yes

  # =========================
  # SYSCTL HARDENING
  # =========================
  - name: Configure sysctl
    sysctl:
      name: "{{ item.key }}"
      value: "{{ item.value }}"
      state: present
      reload: yes
    loop: "{{ sysctl_rules }}"

  # =========================
  # PASSWORD POLICY
  # =========================
  - name: Configure pwquality
    lineinfile:
      path: /etc/security/pwquality.conf
      regexp: '^{{ item.key }}'
      line: '{{ item.key }} = {{ item.value }}'
      create: yes
    loop: "{{ pwquality_rules }}"

  - name: Configure password aging
    lineinfile:
      path: /etc/login.defs
      regexp: '^{{ item.key }}'
      line: '{{ item.key }} {{ item.value }}'
    loop:
      - { key: 'PASS_MAX_DAYS', value: '90' }
      - { key: 'PASS_MIN_DAYS', value: '7' }
      - { key: 'PASS_WARN_AGE', value: '7' }

  # =========================
  # FAIL DELAY (FIX SCAP FAIL)
  # =========================
  - name: Set FAIL_DELAY
    lineinfile:
      path: /etc/login.defs
      regexp: '^FAIL_DELAY'
      line: 'FAIL_DELAY 4'
      create: yes

  # =========================
  # FAILLOCK CONFIG (FULL FIX)
  # =========================
  - name: Configure faillock.conf (strict CIS)
    copy:
      dest: /etc/security/faillock.conf
      content: |
        deny = 5
        fail_interval = 900
        unlock_time = 900
        even_deny_root
        root_unlock_time = 900
        audit
        silent
      owner: root
      group: root
      mode: '0644'

  # =========================
  # CLEAN OLD CONFIG (IMPORTANT)
  # =========================
  - name: Remove old faillock config
    replace:
      path: /etc/pam.d/common-auth
      regexp: '.*pam_faillock.so.*'
      replace: ''

  # =========================
  # PAM FAILLOCK (CORRECT ORDER)
  # =========================
  - name: PAM faillock preauth
    lineinfile:
      path: /etc/pam.d/common-auth
      insertafter: '^auth.*pam_env.so'
      line: 'auth required pam_faillock.so preauth silent audit deny=5 unlock_time=900'

  - name: PAM faillock authfail
    lineinfile:
      path: /etc/pam.d/common-auth
      insertbefore: '^auth.*pam_deny.so'
      line: 'auth [default=die] pam_faillock.so authfail audit deny=5 unlock_time=900'

  - name: PAM faillock account
    lineinfile:
      path: /etc/pam.d/common-account
      regexp: 'pam_faillock.so'
      line: 'account required pam_faillock.so'

  # =========================
  # PASSWORD HISTORY
  # =========================
  - name: Configure password history
    lineinfile:
      path: /etc/pam.d/common-password
      insertbefore: '^password.*pam_unix.so'
      line: 'password required pam_pwhistory.so remember=5 use_authtok'

  # =========================
  # SSH HARDENING
  # =========================
  - name: Harden SSH basic config
    lineinfile:
      path: /etc/ssh/sshd_config
      regexp: '^{{ item.key }}'
      line: '{{ item.key }} {{ item.value }}'
      create: yes
    loop:
      - { key: 'PermitRootLogin', value: 'no' }
      - { key: 'MaxAuthTries', value: '4' }
      - { key: 'LoginGraceTime', value: '60' }
      - { key: 'MaxSessions', value: '4' }
      - { key: 'MaxStartups', value: '10:30:60' }
      - { key: 'ClientAliveInterval', value: '300' }
      - { key: 'ClientAliveCountMax', value: '0' }
      - { key: 'LogLevel', value: 'INFO' }

  - name: Set SSH crypto policy
    blockinfile:
      path: /etc/ssh/sshd_config
      marker: "# {mark} ANSIBLE SSH HARDENING"
      block: |
        Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
        MACs hmac-sha2-512,hmac-sha2-256
        KexAlgorithms curve25519-sha256

  - name: Restart SSH
    service:
      name: ssh
      state: restarted

  # =========================
  # FILE PERMISSIONS
  # =========================
  - name: Secure critical files
    file:
      path: "{{ item.path }}"
      owner: root
      group: root
      mode: "{{ item.mode }}"
    loop:
      - { path: '/etc/shadow', mode: '0640' }
      - { path: '/etc/gshadow', mode: '0640' }
      - { path: '/etc/passwd', mode: '0644' }

  # =========================
  # SERVICES
  # =========================
  - name: Enable auditd
    service:
      name: auditd
      enabled: yes
      state: started

  - name: Enable chrony
    service:
      name: chrony
      enabled: yes
      state: started

  # =========================
  # AIDE (SAFE MODE)
  # =========================
  - name: Initialize AIDE (skip if heavy)
    command: aideinit
    args:
      creates: /var/lib/aide/aide.db.new
    ignore_errors: yes

  - name: Move AIDE DB if exists
    command: mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
    ignore_errors: yes

  - name: Setup AIDE cron
    cron:
      name: "Run AIDE check"
      job: "/usr/bin/aide --check"
      minute: "0"
      hour: "5"

      ansible-playbook ~/ansible/ubuntu-cis-phase1/playbooks/phase1_fixed.yml   -i ~/ansible/ubuntu-cis-phase1/inventories/prod/hosts.ini   --limit ubuntu22 --diff