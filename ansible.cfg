[defaults]
vault_password_file = .vault_pass
inventory = inventories/hkl.ini
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600
# Global operation timeout — also governs "waiting for privilege escalation
# prompt" on the become plugin. Default is 10s, which is tight on loaded
# k3s nodes where sudo/PAM can briefly block longer than that. 60s gives
# plenty of slack without masking truly stuck hosts (the SSH keepalive in
# [ssh_connection] catches dropped channels separately).
timeout = 60

[ssh_connection]
pipelining = True
# ServerAliveInterval/CountMax: detect a dead channel in ~2 minutes instead
# of hanging forever. Critical for long-running tasks like aideinit on k3s
# nodes, where the SSH channel can idle across wifi/NAT reconnects.
# TCPKeepAlive provides a second layer at the TCP stack.
#
# ControlPersist=600s (was 60s; bumped 2026-04-30 after dry-run hit
# "Data could not be sent" mid-role on 5 hosts in the post-apt-upgrade
# window). The role's apt upgrade task can take 3-5 min per host; if the
# multiplex socket idle-times out during that gap, the next task fails
# the SSH send. 10 min keeps the socket alive across the whole role run.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes
# Timeout before giving up on SSH handshake (seconds). Default is 10 which
# is tight for some environments; 60s gives more slack without masking
# genuinely unreachable hosts.
timeout = 60
# Retry transient SSH connection/send failures up to 3 times before
# marking the task failed. Belt-and-braces alongside the bumped
# ControlPersist above.
retries = 3

[privilege_escalation]
become = True
become_method = sudo
