# =============================================================================
# PROD / DC inventory — CIS Level 1 hardening scope
# =============================================================================
# Source of truth: service-role table verified by DevOps team (2026-04-19).
# All hosts sit on the 172.16.102.0/24 subnet.
#
# DO NOT run against this inventory until:
#   1) DR dress rehearsal (inventories/dr.ini) has completed cleanly
#   2) Change ticket approved
#   3) Maintenance window scheduled with clinical ops
#   4) HIS application team engaged for per-tier smoke tests
#   5) Proxmox snapshots taken for every host in the target phase
#
# Run patterns (one tier at a time, inner → outer):
#   Sanity:             ansible -i inventories/prod.ini prod -m ping
#   One tier, dry-run:  ansible-playbook -i inventories/prod.ini site-offline.yml \
#                         --limit phase1_observer --check --diff
#   One tier live:      ansible-playbook -i inventories/prod.ini site-offline.yml \
#                         --limit phase1_observer --diff
#
# Ubuntu version notes:
#   - prod-minio-01/02/03/04 (.40-.42, .44) are Ubuntu 22.04 — only these four.
#   - Everything else in this file is Ubuntu 24.04.
#   - This CORRECTS the earlier hkl.ini which grouped .30-.38 under [u22];
#     per the verified service-role table those are Ubuntu 24.
#
# See PRODUCTION_ROLLOUT_PLAN.md for the full sequence and validation
# checkpoints between phases.
# =============================================================================

