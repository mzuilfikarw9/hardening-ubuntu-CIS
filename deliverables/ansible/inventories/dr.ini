# =============================================================================
# DR (Disaster Recovery) inventory
# =============================================================================
# Mirrors production topology on the 172.16.202.0/24 subnet.
# Use this for the Phase 0 dress rehearsal before touching production.
#
# Run patterns:
#   Sanity:            ansible -i inventories/dr.ini dr -m ping
#   Dry-run, a tier:   ansible-playbook -i inventories/dr.ini site-offline.yml \
#                        --limit k3s_workers --check --diff
#   One tier live:     ansible-playbook -i inventories/dr.ini site-offline.yml \
#                        --limit k3s_workers --diff
#   Whole DR (risky):  ansible-playbook -i inventories/dr.ini site-offline.yml --diff
#
# Recommended pattern: run the phase groups in order, validating each tier
# before moving to the next. See PRODUCTION_ROLLOUT_PLAN.md for validation
# commands per tier.
#
# Note: DR hostnames in the source-of-truth still carry the "prod-" prefix
# (e.g. prod-mysql-01 at 172.16.202.30). We use "dr-" aliases here so the
# Ansible logs are unambiguous about which environment was touched.
# =============================================================================

# -------- Tier groups ---------------------------------------------------------
# Note: DR has no dedicated monitoring VM — the prod monitoring host
# (172.16.102.13) observes DR as well. Monitoring is hardened in the prod
# rollout, not here.

[haproxy]
dr-haprox-01 ansible_host=172.16.202.10
dr-haprox-02 ansible_host=172.16.202.11

[k3s_masters]
dr-k3s-master-01 ansible_host=172.16.202.20
dr-k3s-master-02 ansible_host=172.16.202.21
dr-k3s-master-03 ansible_host=172.16.202.22

[k3s_workers]
dr-k3s-worker-01 ansible_host=172.16.202.23
dr-k3s-worker-02 ansible_host=172.16.202.24
dr-k3s-worker-03 ansible_host=172.16.202.25
# Added 2026-04-17 after `kubectl get nodes` revealed 5 workers in the cluster,
# not 3. The original inventory was built from an incomplete IP list — worth
# re-running `kubectl get nodes -o wide` against prod to check for similar
# drift before Apr 23 prod rollout.
dr-k3s-worker-04 ansible_host=172.16.202.26
dr-k3s-worker-05 ansible_host=172.16.202.27

[mysql]
dr-mysql-01 ansible_host=172.16.202.30
dr-mysql-02 ansible_host=172.16.202.31
dr-mysql-03 ansible_host=172.16.202.32

[proxysql]
dr-proxysql-01 ansible_host=172.16.202.33
dr-proxysql-02 ansible_host=172.16.202.34
# 172.16.202.35 is the floating VIP (keepalived) — not a real host, not in inventory.

[mongo_rabbit]
dr-mongo-rabbit-01 ansible_host=172.16.202.36
dr-mongo-rabbit-02 ansible_host=172.16.202.37
dr-mongo-rabbit-03 ansible_host=172.16.202.38

# -------- Rollout phases ------------------------------------------------------
# Use these with --limit to run one phase at a time, inner → outer.
# Phase numbers match the prod rollout plan; phase1_observer is prod-only
# (DR has no dedicated monitoring host).

[phase2_k3s_data:children]
k3s_workers

[phase3_k3s_control:children]
k3s_masters

[phase4_messaging:children]
mongo_rabbit

[phase5_db_proxy:children]
proxysql

[phase6_db:children]
mysql

[phase7_edge:children]
haproxy

# -------- Environment superset ------------------------------------------------

[dr:children]
haproxy
k3s_masters
k3s_workers
mysql
proxysql
mongo_rabbit

# -------- Shared connection settings ------------------------------------------

[dr:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/Documents/clicque/leet-clicque-key.pem
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
# The playbook runs `become: true`. If the ubuntu user needs a sudo password,
# pass --ask-become-pass on the command line.
